<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Maestro Dev</title>
    <link rel="icon" href="/icon-192.png" />
    <style>
      /* Bloque de arranque: tapa el hueco entre el splash del sistema y el
         primer render de React. Sin animación, para que no parpadee. */
      #arranque {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--fondo-base, #0d1117);
      }
      #arranque img {
        width: 128px;
        height: 128px;
        object-fit: contain;
      }
    </style>
    <script>
      // Corre antes de pintar nada: fija el fondo del tema guardado para que no
      // haya flash de oscuro a claro cuando React aplica el tema al montar.
      (function () {
        var FONDOS = {
          verde: '#0d1117',
          clasico: '#ffffff',
          mocha: '#1e1e2e',
          medianoche: '#2e3440',
        };
        var id = 'verde';
        try { id = localStorage.getItem('tema-visual') || 'verde'; } catch (e) {}
        var fondo = FONDOS[id] || FONDOS.verde;
        document.documentElement.style.backgroundColor = fondo;
        document.documentElement.style.setProperty('--fondo-base', fondo);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', fondo);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="arranque"><img src="/icon-512.png" alt="" /></div>
    </div>
    <script>
      (function () {
        function mostrarError(msg) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif">' +
            '<div style="background:#161b22;border:1px solid #f85149;border-radius:12px;padding:24px;max-width:360px;width:100%;text-align:center">' +
            '<p style="color:#f85149;font-size:14px;font-weight:bold;margin-bottom:8px">Error de carga</p>' +
            '<p style="color:#8b949e;font-size:11px;word-break:break-word;margin-bottom:16px">' + String(msg).substring(0, 300) + '</p>' +
            '<button onclick="location.reload()" style="background:#238636;color:white;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px">Recargar</button>' +
            '</div></div>';
        }
        function esErrorIgnorable(texto) {
          // Solo el error transitorio del chequeo de actualización del ServiceWorker.
          // Cualquier otro error se muestra normal para poder verlo.
          return /ServiceWorker|sw\.js/i.test(String(texto));
        }
        window.onerror = function (msg, src, line, col, error) {
          var texto = error ? error.message : msg;
          if (esErrorIgnorable(texto)) return true;
          mostrarError(texto);
          return true;
        };
        window.addEventListener('unhandledrejection', function (e) {
          var texto = e.reason && e.reason.message ? e.reason.message : String(e.reason);
          if (esErrorIgnorable(texto)) return;
          mostrarError(texto);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
