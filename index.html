<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Maestro Dev</title>
    <link rel="icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="splash" style="position:fixed;inset:0;background:#0d1117;z-index:9999;transition:opacity .3s ease"></div>
    <div id="root"></div>
    <script>
      (function () {
        function mostrarError(msg) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif">' +
            '<div style="background:#161b22;border:1px solid #f85149;border-radius:12px;padding:24px;max-width:360px;width:100%;text-align:center">' +
            '<p style="color:#f85149;font-size:14px;font-weight:bold;margin-bottom:8px">Error de carga</p>' +
            '<p style="color:#8b949e;font-size:11px;word-break:break-word;margin-bottom:16px">' + String(msg).substring(0, 300) + '</p>' +
            '<button onclick="location.reload()" style="background:#238636;color:white;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px">Recargar</button>' +
            '</div></div>';
        }
        function esErrorIgnorable(texto) {
          // Solo el error transitorio del chequeo de actualización del ServiceWorker.
          // Cualquier otro error se muestra normal para poder verlo.
          return /ServiceWorker|sw\.js/i.test(String(texto));
        }
        window.onerror = function (msg, src, line, col, error) {
          var texto = error ? error.message : msg;
          if (esErrorIgnorable(texto)) return true;
          mostrarError(texto);
          return true;
        };
        window.addEventListener('unhandledrejection', function (e) {
          var texto = e.reason && e.reason.message ? e.reason.message : String(e.reason);
          if (esErrorIgnorable(texto)) return;
          mostrarError(texto);
        });

        // Red de seguridad: si la app no cargó (splash sigue), ofrecer recargar en vez de quedar en negro
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (s) {
            s.style.display = 'flex';
            s.style.alignItems = 'center';
            s.style.justifyContent = 'center';
            s.innerHTML =
              '<div style="text-align:center;font-family:sans-serif;padding:24px">' +
              '<p style="color:#8b949e;font-size:13px;margin-bottom:16px">La app tardó en cargar</p>' +
              '<button onclick="location.reload()" style="background:#238636;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer">Recargar</button>' +
              '</div>';
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
